<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Horario Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="topbar">
  <div id="row1">
    <div class="row1-side"></div>
    <div class="row1-center">
      <span class="role-badge" id="roleBadge"></span>
      <button class="btn owner-only" onclick="shiftWeek(-1)" title="Semana anterior">◀</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="btn owner-only" onclick="shiftWeek(1)" title="Semana siguiente">▶</button>
      <button class="btn owner-only" id="todayBtn" onclick="resetToCurrentWeek()" title="Volver a la semana actual" style="display:none">Hoy</button>
    </div>
    <div class="ctrls">
      <div class="dropdown" id="actPickerDD">
        <button class="btn act-picker-btn" onclick="toggleDropdown('actPickerPanel')">
          <span class="act-pick-swatch" id="actPickerSwatch"></span>
          <span id="actPickerLabel">Actividad</span> ▾
        </button>
        <div class="dropdown-panel" id="actPickerPanel">
          <input type="text" id="actPickerSearch" class="owner-only" placeholder="🔍 Buscar actividad…" autocomplete="off">
          <div id="actPickerList" class="owner-only"></div>
          <button class="btn owner-only" id="editActsBtn" onclick="openActivityEditor()">✏️ Editar actividades</button>

          <!-- El invitado no ve la lista de actividades del propietario (puede
               tener cosas privadas ahí) — solo puede crear la suya propia. -->
          <div class="guest-only" id="guestActCreate">
            <input type="text" id="guestActName" placeholder="¿Qué quieres proponer? (ej. Cita, Estudiar)" maxlength="40">
            <div class="guest-act-row">
              <input type="text" id="guestActIcon" placeholder="🙂" maxlength="4">
              <input type="color" id="guestActColor" value="#CDE4F7" title="Color">
            </div>
            <button class="btn" onclick="createGuestActivity()">+ Crear y usar</button>
            <div id="guestActList"></div>
          </div>
        </div>
      </div>

      <input type="text" id="guestNameInput" class="guest-only" placeholder="Tu nombre" maxlength="60" autocomplete="off">
      <button class="btn guest-only" id="guestPaintBtn" onclick="toggleGuestPaintMode()" title="Actívalo para marcar celdas; apágalo para desplazarte sin proponer nada">🖌️ Modo proponer: OFF</button>

      <input type="text" id="bookingNameInput" class="booking-only" placeholder="Tu nombre" maxlength="60" autocomplete="off">
      <button class="btn booking-only" id="bookingPickBtn" onclick="toggleBookingPickMode()" title="Actívalo para elegir una casilla libre; apágalo para desplazarte sin agendar nada">📅 Modo agendar: OFF</button>

      <button class="btn" id="tbtn" onclick="toggleTheme()">🌙</button>

      <div class="dropdown" id="settingsDD">
        <button class="btn" onclick="toggleDropdown('settingsPanel')">⚙️</button>
        <div class="dropdown-panel dropdown-panel-menu" id="settingsPanel">
          <button class="btn owner-only" id="propBtn" onclick="openPropModal()">📩 Propuestas (0)</button>
          <button class="btn owner-only" id="citasBtn" onclick="openCitasModal()">❤️ Citas (0)</button>
          <button class="btn guest-only" onclick="copyProposalsText()">📋 Copiar propuestas</button>
          <button class="btn" id="notifBtn" onclick="toggleNotifs()">🔕 Avisos</button>
          <button class="btn owner-only" id="gpullBtn" onclick="pullFromGoogleCalendar()" title="Trae el horario guardado en Google y lo guarda como tu horario local">🔄 Traer de Google</button>
          <button class="btn owner-only" onclick="saveData()" title="Guarda tu horario y lo sincroniza con Google de una vez">💾 Guardar</button>
          <button class="btn owner-only" onclick="clearAll()">🧹 Limpiar</button>
          <button class="btn owner-only" onclick="resetAll()" title="Descarta los cambios sin guardar y recarga lo último guardado en el servidor">↺ Recargar</button>

          <div class="settings-divider owner-only"></div>
          <span class="modal-subtitle owner-only" style="margin:0">Reglas para invitados</span>
          <div class="rules-row owner-only">
            <label>Desde <select id="ruleStart"></select></label>
            <label>Hasta <select id="ruleEnd"></select></label>
          </div>
          <label class="rules-max owner-only">Máx. horas pendientes a la vez
            <input type="number" id="ruleMaxHours" min="1" max="168" placeholder="Sin límite">
          </label>
          <button class="btn owner-only" onclick="onSaveGuestRules()">💾 Guardar reglas</button>
        </div>
      </div>

      <div class="dropdown" id="styleDD">
        <button class="btn" onclick="toggleDropdown('stylePanel')">🎨</button>
        <div class="dropdown-panel dropdown-panel-menu" id="stylePanel">
          <label class="style-row">Fuente
            <select id="styleFont">
              <option value="'DM Sans', system-ui, sans-serif">DM Sans (original)</option>
              <option value="'Inter', system-ui, sans-serif">Inter</option>
              <option value="'Poppins', system-ui, sans-serif">Poppins</option>
              <option value="'Roboto Mono', monospace">Roboto Mono</option>
              <option value="Georgia, 'Times New Roman', serif">Georgia (serif)</option>
              <option value="system-ui, -apple-system, sans-serif">Del sistema</option>
            </select>
          </label>
          <label class="style-row">Líneas de la cuadrícula <input type="color" id="styleGridLine"></label>
          <label class="style-row">Ancho de las líneas <span class="style-range"><input type="range" id="styleGridLineWidth" min="0" max="3" step="0.5"><span id="styleGridLineWidthVal"></span></span></label>
          <label class="style-row">Color de la hora <input type="color" id="styleHourColor"></label>
          <label class="style-row">Tamaño de la hora <span class="style-range"><input type="range" id="styleHourFontSize" min="7" max="16" step="1"><span id="styleHourFontSizeVal"></span></span></label>
          <label class="style-row">Tamaño de las actividades <span class="style-range"><input type="range" id="styleCellFontSize" min="7" max="16" step="1"><span id="styleCellFontSizeVal"></span></span></label>
          <label class="style-row">Color del día <input type="color" id="styleDayColor"></label>
          <label class="style-row">Marcador de "ahora" <input type="color" id="styleNowMarker"></label>
          <button class="btn" onclick="resetStyleOverrides()">↺ Restablecer estilos</button>
        </div>
      </div>

      <button class="btn" id="logoutBtn" onclick="logout()" style="display:none">🚪 Salir</button>
    </div>
  </div>
</div>

<div id="grid">
  <table id="sched">
    <thead><tr id="hrow"></tr></thead>
    <tbody id="sbody"></tbody>
  </table>
</div>

<!-- Barra de "borrador" del invitado: aparece solo mientras tiene celdas
     marcadas sin enviar (ver toggleDraft/submitDraft en grid.js). -->
<div id="draftBar" class="guest-only">
  <span id="draftCount"></span>
  <button class="btn" onclick="discardDraft()">✕ Descartar</button>
  <button class="btn btn-primary" onclick="submitDraft()">✓ Enviar propuestas</button>
</div>

<!-- Rol "booking": ve el horario real igual que el invitado (de forma
     transparente, a propósito) y elige una casilla libre para pedir una cita
     con fecha real — este modal se abre al hacer clic con "Modo agendar"
     activo (ver openBookingModal en booking.js). -->
<div id="bookingModal" class="modal-overlay">
  <div class="modal-box">
    <h2>📅 Agendar cita</h2>
    <p class="booking-range" id="bkDateLabel"></p>
    <form id="bookingModalForm">
      <div class="booking-fields">
        <label>Empieza<select id="bkStart" required></select></label>
        <label>Duración<select id="bkDuration" required></select></label>
      </div>
      <select id="bkType">
        <option value="🌆 Salida">🌆 Salida</option>
        <option value="☕ Café">☕ Café</option>
        <option value="🍽️ Comer algo">🍽️ Comer algo</option>
        <option value="🎬 Cine">🎬 Cine</option>
        <option value="🚶 Caminar">🚶 Caminar</option>
        <option value="😏 Quedarnos en casa">😏 Quedarnos en casa</option>
        <option value="__other__">✏️ Otro…</option>
      </select>
      <input type="text" id="bkTypeOther" placeholder="¿Qué plan quieres proponer?" hidden>
      <input type="text" id="bkBudget" placeholder="Presupuesto (opcional, ej. $50.000)" autocomplete="off">
      <select id="bkPayment">
        <option value="💵 Efectivo">💵 Efectivo</option>
        <option value="💳 Tarjeta">💳 Tarjeta</option>
        <option value="📱 Nequi">📱 Nequi</option>
        <option value="😏 Con el cuerpo">😏 Con el cuerpo</option>
      </select>
      <input type="text" id="bkName" placeholder="Tu nombre" required autocomplete="name">
      <input type="text" id="bkNote" placeholder="Nota (opcional)" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeBookingModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Enviar solicitud</button>
      </div>
    </form>
  </div>
</div>

<div id="dragTip"></div>
<div id="toast"></div>

<div id="lockScreen">
  <div class="modal-box alert-box">
    <div id="alertIcon">🔒</div>
    <h2>Mi Horario Semanal</h2>
    <p id="lockHint">Ingresa la contraseña para entrar</p>
    <form id="lockForm">
      <input type="password" id="lockPass" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p id="lockError" class="lock-error"></p>
  </div>
</div>

<div id="propModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Propuestas de invitados</h2>
    <div id="propList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="approveAllProposals()">✓ Aprobar todas</button>
      <button class="btn" onclick="closePropModal()">Cerrar</button>
    </div>
  </div>
</div>

<div id="citasModal" class="modal-overlay">
  <div class="modal-box">
    <h2>❤️ Solicitudes de cita</h2>
    <div id="bookingRequestsList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeCitasModal()">Cerrar</button>
    </div>
  </div>
</div>

<div id="alertModal">
  <div class="modal-box alert-box">
    <div id="alertIcon">⏰</div>
    <h2 id="alertTitle">Cambio de actividad</h2>
    <p id="alertBody"></p>
    <button class="btn btn-primary" id="alertAcceptBtn" onclick="acknowledgeActivityAlert()">Aceptar</button>
  </div>
</div>

<div id="actModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Actividades</h2>
    <input type="text" id="actSearch" placeholder="🔍 Buscar actividad…" autocomplete="off">
    <div id="actList"></div>
    <form id="newActForm">
      <input type="text" id="newActName" placeholder="Nueva actividad…" required>
      <input type="text" id="newActIcon" placeholder="🙂" maxlength="4">
      <input type="color" id="newActBg" value="#ececea" title="Color de fondo">
      <input type="color" id="newActFg" value="#333333" title="Color de letra">
      <button type="submit" class="btn">+ Añadir</button>
    </form>
    <div class="modal-actions">
      <button class="btn" onclick="closeActivityEditor()">Listo</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/activities.js"></script>
<script src="js/grid.js"></script>
<script src="js/events.js"></script>
<script src="js/booking.js"></script>
<script src="js/notify.js"></script>
<script src="js/google-sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
