<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Horario Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="topbar">
  <div id="row1">
    <span class="title">🗓 Mi Horario Semanal</span>
    <div class="ctrls">
      <span class="hint">Clic · Arrastra · 2×clic borra</span>
      <span class="hint" id="roleBadge"></span>
      <button class="btn owner-only" id="propBtn" onclick="openPropModal()">📩 Propuestas (0)</button>
      <button class="btn guest-only" onclick="copyProposalsText()">📋 Copiar propuestas</button>
      <button class="btn" id="tbtn" onclick="toggleTheme()">🌙</button>
      <button class="btn" id="notifBtn" onclick="toggleNotifs()">🔕 Avisos</button>
      <button class="btn" onclick="exportICS()">📅 Exportar .ics</button>
      <button class="btn owner-only" id="gsyncBtn" onclick="syncGoogleCalendar()" title="Sube tu horario local a Google, sobrescribiendo lo que haya ahí">📆 Sincronizar Google</button>
      <button class="btn owner-only" id="gpullBtn" onclick="pullFromGoogleCalendar()" title="Trae el horario guardado en Google y reemplaza el local, para coordinar entre computadores">🔄 Traer de Google</button>
      <button class="btn owner-only" onclick="saveData()">💾 Guardar</button>
      <button class="btn owner-only" onclick="clearAll()">🧹 Limpiar</button>
      <button class="btn owner-only" onclick="resetAll()">↺ Recargar</button>
      <button class="btn" id="logoutBtn" onclick="logout()" style="display:none">🚪 Salir</button>
    </div>
  </div>
  <div id="pal-row">
    <span class="pal-lbl">Actividad →</span>
    <div id="palette"></div>
    <button class="btn owner-only" id="editActsBtn" onclick="openActivityEditor()">✏️ Editar</button>
  </div>
</div>

<div id="grid">
  <table id="sched">
    <thead><tr id="hrow"></tr></thead>
    <tbody id="sbody"></tbody>
  </table>
</div>

<div id="dragTip"></div>
<div id="toast"></div>

<div id="lockScreen">
  <div class="modal-box alert-box">
    <div id="alertIcon">🔒</div>
    <h2>Mi Horario Semanal</h2>
    <p id="lockHint">Ingresa la contraseña para entrar</p>
    <form id="lockForm">
      <input type="password" id="lockPass" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p id="lockError" class="lock-error"></p>
  </div>
</div>

<div id="propModal">
  <div class="modal-box">
    <h2>Propuestas de invitados</h2>
    <div id="propList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closePropModal()">Cerrar</button>
    </div>
  </div>
</div>

<div id="alertModal">
  <div class="modal-box alert-box">
    <div id="alertIcon">⏰</div>
    <h2 id="alertTitle">Cambio de actividad</h2>
    <p id="alertBody"></p>
    <button class="btn btn-primary" id="alertAcceptBtn" onclick="acknowledgeActivityAlert()">Aceptar</button>
  </div>
</div>

<div id="actModal">
  <div class="modal-box">
    <h2>Actividades</h2>
    <input type="text" id="actSearch" placeholder="🔍 Buscar actividad…" autocomplete="off">
    <div id="actList"></div>
    <form id="newActForm">
      <input type="text" id="newActName" placeholder="Nueva actividad…" required>
      <input type="text" id="newActIcon" placeholder="🙂" maxlength="4">
      <input type="color" id="newActBg" value="#ececea" title="Color de fondo">
      <input type="color" id="newActFg" value="#333333" title="Color de letra">
      <button type="submit" class="btn">+ Añadir</button>
    </form>
    <div class="modal-actions">
      <button class="btn" onclick="closeActivityEditor()">Listo</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/activities.js"></script>
<script src="js/grid.js"></script>
<script src="js/ics.js"></script>
<script src="js/notify.js"></script>
<script src="js/google-sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
